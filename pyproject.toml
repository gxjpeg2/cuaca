[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["cuaca", "simulasi"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S310", "S603", "S607"]
"simulasi/*" = ["S311"]

[tool.mypy]
files = ["cuaca", "simulasi"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["cuaca", "simulasi"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
