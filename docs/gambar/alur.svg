<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="960" height="490" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Alur pipeline Cuaca</title>
  <defs>
    <marker id="panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="960" height="490" fill="#ffffff"/>

  <rect x="20" y="16" width="920" height="44" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="480" y="43" text-anchor="middle" font-size="15" fill="#111827">Airflow: DAG cuaca_harian, jadwal 06:00 WIB, task etl lalu cek_kesehatan</text>

  <rect x="20" y="110" width="170" height="80" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="105" y="143" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">Open-Meteo</text>
  <text x="105" y="165" text-anchor="middle" font-size="12" fill="#374151">archive + forecast</text>

  <rect x="250" y="110" width="170" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="335" y="143" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">extract.py</text>
  <text x="335" y="165" text-anchor="middle" font-size="12" fill="#374151">retry dan cache</text>

  <rect x="480" y="110" width="170" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="565" y="143" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">transform.py</text>
  <text x="565" y="165" text-anchor="middle" font-size="12" fill="#374151">validasi, waktu lokal</text>

  <rect x="710" y="110" width="170" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="795" y="143" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">load.py</text>
  <text x="795" y="165" text-anchor="middle" font-size="12" fill="#374151">upsert idempotent</text>

  <line x1="190" y1="150" x2="248" y2="150" stroke="#374151" stroke-width="1.8" marker-end="url(#panah)"/>
  <line x1="420" y1="150" x2="478" y2="150" stroke="#374151" stroke-width="1.8" marker-end="url(#panah)"/>
  <line x1="650" y1="150" x2="708" y2="150" stroke="#374151" stroke-width="1.8" marker-end="url(#panah)"/>

  <text x="565" y="212" text-anchor="middle" font-size="12" fill="#b45309">jam rusak masuk tabel karantina</text>

  <line x1="795" y1="190" x2="795" y2="258" stroke="#374151" stroke-width="1.8" marker-end="url(#panah)"/>

  <rect x="620" y="260" width="320" height="212" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="780" y="286" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">PostgreSQL</text>
  <g font-size="12.5" fill="#111827">
    <text x="636" y="316" fill="#6b7280">dimensi</text>
    <text x="706" y="316">dim_lokasi, dim_tanggal,</text>
    <text x="706" y="334">dim_kode_cuaca</text>
    <text x="636" y="362" fill="#6b7280">fakta</text>
    <text x="706" y="362">fact_cuaca_jam,</text>
    <text x="706" y="380">fact_prakiraan_jam</text>
    <text x="636" y="408" fill="#6b7280">catatan</text>
    <text x="706" y="408">cuaca_revisi, karantina</text>
    <text x="636" y="436" fill="#6b7280">mart</text>
    <text x="706" y="436">mart_cuaca_harian,</text>
    <text x="706" y="454">mart_akurasi_prakiraan</text>
  </g>

  <rect x="330" y="300" width="200" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="430" y="333" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">ringkasan.py</text>
  <text x="430" y="355" text-anchor="middle" font-size="12" fill="#374151">query dari database</text>
  <line x1="620" y1="340" x2="532" y2="340" stroke="#374151" stroke-width="1.8" marker-end="url(#panah)"/>

  <rect x="60" y="300" width="200" height="80" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
  <text x="160" y="333" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">output/*.csv</text>
  <text x="160" y="355" text-anchor="middle" font-size="12" fill="#374151">enam file untuk analis</text>
  <line x1="330" y1="340" x2="262" y2="340" stroke="#374151" stroke-width="1.8" marker-end="url(#panah)"/>

  <rect x="60" y="420" width="470" height="44" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="295" y="447" text-anchor="middle" font-size="13" fill="#111827">kesehatan.py membaca riwayat_run.jsonl (exit code 0, 1, 2)</text>
</svg>
